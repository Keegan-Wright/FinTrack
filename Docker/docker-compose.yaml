services:
  fintrack-postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${FINTRACK_POSTGRES_PASSWORD}"
    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "FinTrack-Postgres-data"
        read_only: false
    networks:
      - "fintrack"
    restart: "unless-stopped"
  fintrackweb:
    image: "docker.io/keeganwright12/fintrackweb:latest"
    ports:
      - 8080:8080
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: 8080
      ENCRYPTION_KEYS: "${FINTRACK_ENCRYPTION_KEYS}"
      ENCRYPTION_CURRENT_KEY_ID: "${FINTRACK_ENCRYPTION_CURRENT_KEY_ID}"
      OPEN_BANKING_TRUELAYER_BASE_AUTH_URL: "${OPENBANKING_AUTH_URL}"
      OPEN_BANKING_TRUELAYER_BASE_DATA_URL: "${OPENBANKING_DATA_URL}"
      OPEN_BANKING_TRUELAYER_AUTH_REDIRECT_URL: "${OPENBANKING_AUTH_REDIRECT_URL}"
      OPEN_BANKING_TRUELAYER_CLIENT_ID: "${OPENBANKING_CLIENT_ID}"
      OPEN_BANKING_TRUELAYER_CLIENT_SECRET: "${OPENBANKING_CLIENT_SECRET}"
      OPEN_BANKING_PUBLIC_IP_ADDRESS: "${OPENBANKING_PUBLIC_IP_ADDRESS}"
      OIDC_Authority: "${OIDC_AUTHORITY}"
      OIDC_ClientId: "${OIDC_CLIENT_ID}"
      OIDC_ClientSecret: "${OIDC_CLIENT_SECRET}"
      ConnectionStrings__FinTrackDb: "Host=FinTrack-Postgres;Port=5432;Username=postgres;Password=${FINTRACK_POSTGRES_PASSWORD};Database=FinTrackDb"
      FINTRACKDB_HOST: "FinTrack-Postgres"
      FINTRACKDB_PORT: "5432"
      FINTRACKDB_USERNAME: "postgres"
      FINTRACKDB_PASSWORD: "${FINTRACK_POSTGRES_PASSWORD}"
      FINTRACKDB_URI: "postgresql://postgres:${FINTRACK_POSTGRES_PASSWORD}@FinTrack-Postgres:5432/FinTrackDb"
      FINTRACKDB_JDBCCONNECTIONSTRING: "jdblc:postgresql://FinTrack-Postgres:5432/FinTrackDb"
      FINTRACKDB_DATABASENAME: "FinTrackDb"
      APP_CULTURE: "${APP_CULTURE}"
      TZ: "${TZ}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "FinTrackWeb"
    expose:
      - 8080
    depends_on:
      fintrack-postgres:
        condition: "service_healthy"
    networks:
      - "fintrack"
      - "proxy" # Remove if not needed
    restart: "unless-stopped"
networks:
  fintrack:
    driver: "bridge"
  # Shared with the reverse proxy, remove if not needed
  proxy:
    name: "${FINTRACK_PROXY_NETWORK:-proxy-net}"
    external: true
volumes:
  FinTrack-Postgres-data:
    driver: "local"
