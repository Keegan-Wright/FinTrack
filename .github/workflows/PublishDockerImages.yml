name: Fintrack Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'

# The GITHUB_TOKEN only needs to check out the code. Artifact uploads and the Docker build cache use the runner's own
# token
permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore

      - name: Unit Tests
        run: |
          for project in Client Domain FinanceTracker Infrastructure; do
            dotnet test --project Test/FinanceTracker.Tests.Unit.$project -c=release || exit 1
          done

      # Trusted, so Aspire's health check of the app's https endpoint can connect. On Linux trusting writes the
      # certificate to ~/.aspnet/dev-certs/trust, which OpenSSL only reads once it's on SSL_CERT_DIR. The runner has
      # no browser certificate stores, so trust is only partial and reported as an error, OpenSSL is all .NET needs
      - name: Create development certificate
        run: |
          dotnet dev-certs https --trust || true
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Integration Tests
        run: dotnet test --project Test/FinanceTracker.Tests.Integration -c=release

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestReport
          path: '**/*-report.html'

  # Pushes to Docker Hub with its own credentials, so the workflow's read only token is enough
  build-and-push-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get tag
        id: tag
        uses: devops-actions/action-get-tag@v1.0.3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Src/Dockerfile
          push: true
          build-args: |
            VERSION=${{steps.tag.outputs.tag}}
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            keeganwright12/fintrackweb:${{steps.tag.outputs.tag}}
          platforms: linux/amd64,linux/arm64
          # GitHub's Actions cache, kept between runs unlike the runner's disk
          cache-from: type=gha
          cache-to: type=gha,mode=max
