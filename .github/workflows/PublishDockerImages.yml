name: Fintrack Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'

# The GITHUB_TOKEN only needs to check out the code. Artifact uploads and the Docker build cache use the runner's own
# token
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore the application
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore

      - name: Unit Tests
        run: |
          for project in Client Domain FinanceTracker Infrastructure; do
            dotnet test --project Test/FinanceTracker.Tests.Unit.$project -c Release || exit 1
          done

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestReport-Unit
          path: '**/*-report.html'

  # The integration tests split across three runners, the UI tests in two as they're the time-consuming ones.
  integration-tests:
    name: Integration tests (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # A look at each page
          - suite: UI pages
            filter: '/*/FinanceTracker.Tests.Integration.Ui/(SeededPageTests|PageRenderTests|AccountPageTests|LoadFailureTests)/*'
            browser: true
          # Everything else in a browser, flows, dialogs and failures, a new UI test class lands here
          - suite: UI flows
            filter: '/*/FinanceTracker.Tests.Integration.Ui/(!(SeededPageTests|PageRenderTests|AccountPageTests|LoadFailureTests))/*'
            browser: true
          # Everything not in a browser, the published image has its own job below
          - suite: API and services
            filter: '/*/(!(FinanceTracker.Tests.Integration.Ui|FinanceTracker.Tests.Integration.Image))/*/*'
            browser: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore

      # Built first, its output holds Playwright's install script
      - name: Build Integration Tests
        run: dotnet build Test/FinanceTracker.Tests.Integration -c Release

      # Trusted, so Aspire's health check of the app's https endpoint can connect. On Linux trusting writes the
      # certificate to ~/.aspnet/dev-certs/trust, which OpenSSL only reads once it's on SSL_CERT_DIR. The runner has
      # no browser certificate stores, so trust is only partial and reported as an error, OpenSSL is all .NET needs
      - name: Create development certificate
        run: |
          dotnet dev-certs https --trust || true
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      # Chromium and the system libraries it needs for the UI tests, which use the app in a browser with Playwright.
      # The tests install Chromium themselves when it's missing, but not its libraries
      - name: Install Playwright's Chromium
        if: matrix.browser
        run: pwsh Test/FinanceTracker.Tests.Integration/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Integration Tests
        run: >-
          dotnet test --project Test/FinanceTracker.Tests.Integration -c Release --no-build
          -- --treenode-filter "${{ matrix.filter }}"

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestReport-${{ matrix.suite }}
          path: '**/*-report.html'

      # What a failed UI test saw, step by step, open with https://trace.playwright.dev
      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: failure() && matrix.browser
        with:
          name: PlaywrightTraces-${{ matrix.suite }}
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore

  # The Docker image as it ships, run with a Postgres and used in a browser. The other UI tests run the app built for
  # testing, so something only a publish gets wrong, e.g. Blazor's own script missing from the image, passes them all
  published-image:
    name: Published image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore

      # Built first, its output holds Playwright's install script
      - name: Build Integration Tests
        run: dotnet build Test/FinanceTracker.Tests.Integration -c Release

      - name: Install Playwright's Chromium
        run: pwsh Test/FinanceTracker.Tests.Integration/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # For this runner's platform, the published images are built for both in the release workflow
      - name: Build the image
        run: docker build -f Src/Dockerfile -t fintrack:ci .

      # A throwaway Postgres and placeholder settings, the image as a self-hoster runs it, until it answers
      - name: Start the image
        run: |
          docker network create fintrack-ci
          docker run -d --name fintrack-ci-db --network fintrack-ci -e POSTGRES_PASSWORD=ci postgres:17.6
          until docker exec fintrack-ci-db pg_isready -U postgres; do sleep 1; done
          docker run -d --name fintrack-ci-web --network fintrack-ci -p 8080:8080 \
            -e HTTP_PORTS=8080 \
            -e ENCRYPTION_KEYS="1:$(head -c 32 /dev/urandom | base64)" -e ENCRYPTION_CURRENT_KEY_ID=1 \
            -e OPEN_BANKING_TRUELAYER_BASE_AUTH_URL=https://auth.example.test \
            -e OPEN_BANKING_TRUELAYER_BASE_DATA_URL=https://api.example.test \
            -e OPEN_BANKING_TRUELAYER_AUTH_REDIRECT_URL=http://localhost:8080/callback \
            -e OPEN_BANKING_TRUELAYER_CLIENT_ID=ci -e OPEN_BANKING_TRUELAYER_CLIENT_SECRET=ci \
            -e OPEN_BANKING_PUBLIC_IP_ADDRESS=127.0.0.1 -e APP_CULTURE=en-GB -e TZ=Europe/London \
            -e "ConnectionStrings__FinTrackDb=Host=fintrack-ci-db;Port=5432;Username=postgres;Password=ci;Database=FinTrackDb" \
            fintrack:ci
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8080/Account/Login; do sleep 2; done'

      - name: Published Image Tests
        env:
          FINTRACK_IMAGE_URL: http://localhost:8080
        run: >-
          dotnet test --project Test/FinanceTracker.Tests.Integration -c Release --no-build
          -- --treenode-filter "/*/FinanceTracker.Tests.Integration.Image/*/*"

      - name: Image logs
        if: failure()
        run: docker logs fintrack-ci-web

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestReport-Published image
          path: '**/*-report.html'

  # Pushes to Docker Hub with its own credentials, so the workflow's read only token is enough
  build-and-push-image:
    needs: [ unit-tests, integration-tests, published-image ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get tag
        id: tag
        uses: devops-actions/action-get-tag@v1.0.3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Src/Dockerfile
          push: true
          build-args: |
            VERSION=${{steps.tag.outputs.tag}}
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            keeganwright12/fintrackweb:${{steps.tag.outputs.tag}}
          platforms: linux/amd64,linux/arm64
          # GitHub's Actions cache, kept between runs unlike the runner's disk
          cache-from: type=gha
          cache-to: type=gha,mode=max


  all-checks:
    name: All checks passed
    needs: [ build, unit-tests, integration-tests, published-image, build-and-push-image ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Every job passed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
