# Tests the plain image as it ships, in a browser against a real Postgres. Catches what only a publish gets wrong,
# such as a script missing from the image. Built for this runner's platform only.
name: Published image

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: How long the job may run.
        type: number
        default: 360

jobs:
  published-image:
    name: Published image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build Integration Tests
        run: dotnet build Test/FinanceTracker.Tests.Integration -c Release

      # The image runs on its own, the tests only drive a browser against it
      - name: Prepare the integration tests
        uses: ./.github/actions/prepare-browser-tests
        with:
          certificate: false

      - name: Build the image
        run: docker build -f Src/Dockerfile -t fintrack:ci .

      - name: Start the image
        uses: ./.github/actions/start-image

      - name: Published Image Tests
        env:
          FINTRACK_IMAGE_URL: http://localhost:8080
        run: >-
          dotnet test --project Test/FinanceTracker.Tests.Integration -c Release --no-build
          -- --treenode-filter "/*/FinanceTracker.Tests.Integration.Image/*/*"

      - name: Image logs
        if: failure()
        run: docker logs fintrack-ci-web

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: TestReport-Published image
          path: '**/*-report.html'
